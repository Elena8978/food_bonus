{% extends 'shop/base.html' %}

{% block title %}Вход — FoodBonus{% endblock %}

{% block extra_css %}
<style>
    .form-container { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
    .form-errors { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
    .button { display: inline-block; padding: 10px 16px; border: 0; border-radius: 8px; background: #0c4b33; color: #fff !important; cursor: pointer; text-decoration: none; }
    .button:hover { background: #0a3d2a; }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <h1>🔑 Вход</h1>

    {% if form.errors %}
        <div class="form-errors">
            <p>Неверное имя пользователя или пароль.</p>
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" name="username" id="username" required>
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" name="password" id="password" required>
        </div>
        
        <button class="button" type="submit" style="width:100%;">Войти</button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>
    
    <p style="text-align:center; margin-top:16px;">
        Нет аккаунта? <a href="/register/">Зарегистрироваться</a>
    </p>
</div>
{% endblock %}
